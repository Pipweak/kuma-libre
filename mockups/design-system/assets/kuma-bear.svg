<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="kuma-title kuma-desc">
  <title id="kuma-title">Kuma, la mascotte ours de Kuma Libre</title>
  <desc id="kuma-desc">Une tête d’ours brune devant un soleil rouge et une montagne enneigée.</desc>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0.82" y2="1">
      <stop stop-color="#d34842" />
      <stop offset="1" stop-color="#b72d2b" />
    </linearGradient>
    <linearGradient id="fur" x1="0.15" y1="0" x2="0.88" y2="1">
      <stop stop-color="#a36236" />
      <stop offset="1" stop-color="#7b4226" />
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff9ee" />
      <stop offset="1" stop-color="#f0dfca" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5c321f" flood-opacity="0.18" />
    </filter>
  </defs>
  <style>
    .kuma-eye {
      animation: kuma-blink 5.6s infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .kuma-eye--right { animation-delay: 0.04s; }
    @keyframes kuma-blink {
      0%, 43%, 47%, 100% { transform: scaleY(1); }
      45% { transform: scaleY(0.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .kuma-eye { animation: none; }
    }
  </style>

  <g id="kuma-background">
    <circle cx="139" cy="56" r="43" fill="url(#sun)" />
    <path d="M56 93 104 37l20 18 18-13 58 51Z" fill="#fffaf1" />
    <path d="m56 93 48-56 20 18 18-13 58 51h-35l-23-20-15 12-22-21-18 29Z" fill="#f3e8d9" />
    <path d="m74 72 30-35 20 18 18-13 39 35-27-12-13 10-18-18-13 16-11-14Z" fill="#fffdf8" />
  </g>

  <g id="kuma-head" filter="url(#soft-shadow)">
    <circle cx="64" cy="101" r="35" fill="url(#fur)" />
    <circle cx="192" cy="101" r="35" fill="url(#fur)" />
    <circle cx="64" cy="101" r="18" fill="url(#muzzle)" />
    <circle cx="192" cy="101" r="18" fill="url(#muzzle)" />
    <path fill="url(#fur)" d="M32 143c0-54 37-85 96-85s96 31 96 85c0 18-5 35-14 49l5 24-24-8c-13 12-28 21-46 25l-17 13-17-13c-18-4-34-13-46-25l-24 8 5-24c-9-14-14-31-14-49Z" />
    <path fill="url(#fur)" d="m38 134-17 14 16 4-12 20 22-7m171-31 17 14-16 4 12 20-22-7" />
    <ellipse cx="128" cy="161" rx="55" ry="49" fill="url(#muzzle)" />
  </g>

  <g id="kuma-face" fill="#232323">
    <g id="kuma-eye-left" class="kuma-eye kuma-eye--left">
      <ellipse cx="91" cy="128" rx="10.5" ry="16" />
      <ellipse cx="94.5" cy="123" rx="3.4" ry="5.4" fill="#fff" />
    </g>
    <g id="kuma-eye-right" class="kuma-eye kuma-eye--right">
      <ellipse cx="165" cy="128" rx="10.5" ry="16" />
      <ellipse cx="168.5" cy="123" rx="3.4" ry="5.4" fill="#fff" />
    </g>
    <path d="M108 153c0-9 9-15 20-15s20 6 20 15c0 8-12 17-20 17s-20-9-20-17Z" />
    <path d="M128 165v14" fill="none" stroke="#232323" stroke-linecap="round" stroke-width="7" />
    <path d="M128 179c-7 13-23 13-31 1m31-1c7 13 23 13 31 1" fill="none" stroke="#232323" stroke-linecap="round" stroke-width="7" />
  </g>
</svg>

